<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <path id="topArc"    d="M 38,250 A 212,212 0 0,0 462,250"/>
    <path id="bottomArc" d="M 38,250 A 212,212 0 0,1 462,250"/>
  </defs>

  <!-- Black background -->
  <circle cx="250" cy="250" r="249" fill="black"/>

  <!-- Outer bold ring (white on black) -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="white" stroke-width="16"/>

  <!-- Inner thin ring -->
  <circle cx="250" cy="250" r="200" fill="none" stroke="white" stroke-width="2.5"/>

  <!-- MOORE COVENANT — top arc -->
  <text font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
        font-size="18" font-weight="900" fill="white" letter-spacing="3.5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">MOORE COVENANT</textPath>
  </text>

  <!-- PRODUCTIONS — bottom arc -->
  <text font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
        font-size="18" font-weight="900" fill="white" letter-spacing="9">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">PRODUCTIONS</textPath>
  </text>

  <!-- Diamond decorators -->
  <polygon points="50,243 57,250 50,257 43,250" fill="white"/>
  <polygon points="450,243 457,250 450,257 443,250" fill="white"/>

  <!-- Short rules -->
  <line x1="60"  y1="250" x2="118" y2="250" stroke="white" stroke-width="1.5"/>
  <line x1="382" y1="250" x2="440" y2="250" stroke="white" stroke-width="1.5"/>

  <!-- Main MCP monogram -->
  <text x="250" y="296"
        font-family="Georgia, 'Times New Roman', Times, serif"
        font-size="142" font-weight="bold"
        text-anchor="middle" fill="white"
        letter-spacing="-4">MCP</text>

  <!-- Small cross — covenant symbol -->
  <line x1="241" y1="324" x2="259" y2="324" stroke="white" stroke-width="2.5"/>
  <line x1="250" y1="315" x2="250" y2="333" stroke="white" stroke-width="2.5"/>
</svg>
