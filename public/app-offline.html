<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Offline</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#080808;color:#e8e3d8;font-family:Inter,system-ui,sans-serif;text-align:center;padding:24px}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:2rem;margin:0 0 .5rem}
  p{color:#9a9590;line-height:1.6;margin:0 0 1.5rem}
  button{background:#c4974a;color:#080808;border:0;border-radius:999px;padding:.8rem 1.6rem;font-size:1rem;font-weight:500}
</style>
</head>
<body>
  <div>
    <h1>You're offline</h1>
    <p>Reconnect and your schedule, payments, and updates will load.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
